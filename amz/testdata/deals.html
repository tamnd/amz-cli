<!--
  A miniature of /deals, copied from a live capture taken on 2026-08-17.

  Two things this fixture exists to hold on to.

  The first is that /deals carries no data-testid and no data-asin. Not few:
  none, in 768 KB of HTML. The parser this replaced looked for both and matched
  nothing, so it returned an empty list and no error. The tile anchor is
  data-csa-c-item-id, and its value is two identifiers in one string: the product
  and the promotion that put it here.

  The second is that /deals answers with rel=canonical pointing at a seasonal
  event page. The URL is stable and what it serves is not, and the canonical is
  where Amazon says so.

  The live page held eleven tiles in one shelf, every one of them carrying a deal
  id, a badge and a struck through price, and not one of them carrying a rating.
  This holds two of them, with the same proportions.
-->
